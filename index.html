<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruins Writer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
</head>
<body>

  
  <header class="site-header">
    <div class="header-ornament left">⸻❧⸻</div>
    <h1 class="site-title">Ruins Writer</h1>
    <div class="header-ornament right">⸻❧⸻</div>
  </header>

  
  <div class="app-layout">

    
    <aside class="symbol-panel" id="symbolPanel">
      <div class="panel-header">
        <span class="panel-title">Ruin Index</span>
      </div>

      
      <nav class="category-tabs" role="tablist">
        <button class="tab-btn active" data-cat="knowledge" role="tab">Knowledge</button>
        <button class="tab-btn" data-cat="life" role="tab">Life</button>
        <button class="tab-btn" data-cat="light" role="tab">Light</button>
        <button class="tab-btn" data-cat="memory" role="tab">Memory</button>
        <button class="tab-btn" data-cat="sound" role="tab">Sound</button>
        <button class="tab-btn" data-cat="space" role="tab">Space</button>
        <button class="tab-btn" data-cat="time" role="tab">Time</button>
        <button class="tab-btn tab-btn--transform" data-cat="transformations" role="tab">⟳ Transforms</button>
      </nav>

      
      <div class="symbol-grid" id="symbolGrid">
        
      </div>
    </aside>

    
    <main class="board-area">
      <div class="board-wrapper">
        <div class="board-label">Inscription Board</div>
        <div class="whiteboard" id="whiteboard">
          <canvas id="runeCanvas"></canvas>
          
        </div>
        <div class="board-hint">Click a ruin to add · Drag to move · Use controls to transform</div>
      </div>
    </main>

    
    <aside class="info-panel" id="infoPanel">

      
      <section class="panel-section" id="infoSection">
        <div class="panel-section-title">⟡ Inscription Details</div>
        <label class="field-label" for="spellName">Name of Inscription</label>
        <input type="text" id="spellName" class="rune-input" placeholder="Unnamed Ruin..." maxlength="60" />

        <label class="field-label" for="spellDesc">Description</label>
        <textarea id="spellDesc" class="rune-textarea" placeholder="Describe the purpose of this inscription..." maxlength="400" rows="4"></textarea>

        <label class="field-label" for="spellAuthor">Scribed By</label>
        <input type="text" id="spellAuthor" class="rune-input" placeholder="Author name..." maxlength="40" />

        <label class="field-label" for="spellCategory">Classification</label>
        <select id="spellCategory" class="rune-select">
          <option value="">— Select —</option>
          <option>Knowledge</option>
          <option>Life</option>
          <option>Light</option>
          <option>Memory</option>
          <option>Sound</option>
          <option>Space</option>
          <option>Time</option>
          <option>Mixed</option>
        </select>
      </section>

      <div class="panel-divider"></div>

      
      <section class="panel-section" id="transformSection">
        <div class="panel-section-title">⟡ Transform Selected</div>
        <div class="selected-info" id="selectedInfo">No ruin selected</div>

        <div class="transform-grid">
          <div></div>
          <button class="ctrl-btn" id="moveUp" title="Move Up">▲</button>
          <div></div>
          <button class="ctrl-btn" id="moveLeft" title="Move Left">◀</button>
          <button class="ctrl-btn center-btn" id="centerSymbol" title="Center">✦</button>
          <button class="ctrl-btn" id="moveRight" title="Move Right">▶</button>
          <div></div>
          <button class="ctrl-btn" id="moveDown" title="Move Down">▼</button>
          <div></div>
        </div>

        <div class="rotate-row">
          <button class="ctrl-btn" id="rotateCCW" title="Rotate Counter-Clockwise">↺</button>
          <div class="rotate-label">Rotate</div>
          <button class="ctrl-btn" id="rotateCW" title="Rotate Clockwise">↻</button>
        </div>

        <div class="scale-row">
          <button class="ctrl-btn" id="scaleDown" title="Scale Down">−</button>
          <div class="rotate-label">Scale</div>
          <button class="ctrl-btn" id="scaleUp" title="Scale Up">+</button>
        </div>

        <button class="action-btn danger-btn" id="deleteSelected">✕ Remove Ruin</button>
        <button class="action-btn" id="clearBoard">Clear Board</button>
      </section>

      <div class="panel-divider"></div>

      
      <section class="panel-section" id="exportSection">
        <div class="panel-section-title">⟡ Export Inscription</div>
        <button class="action-btn export-btn" id="exportPNG">⬇ Export as PNG</button>
        <button class="action-btn export-btn" id="exportSVG">⬇ Export as SVG</button>
        <button class="action-btn export-btn" id="exportJSON">⬇ Save as JSON</button>
        <button class="action-btn export-btn" id="importJSON">⬆ Load from JSON</button>
        <input type="file" id="jsonFileInput" accept=".json" style="display:none" />
      </section>

    </aside>
  </div>

  
  <template id="runeTemplate">
    <div class="placed-ruin" tabindex="0">
      <img class="rune-img" draggable="false" />
      <button class="rune-delete-btn" title="Remove">✕</button>
    </div>
  </template>

  
  <div class="info-popup" id="infoPopup" role="tooltip" aria-hidden="true">
    <div class="info-popup-img-wrap">
      <img class="info-popup-img" id="infoPopupImg" alt="" />
    </div>
    <div class="info-popup-body">
      <div class="info-popup-name" id="infoPopupName"></div>
      <div class="info-popup-desc" id="infoPopupDesc"></div>
    </div>
  </div>

  <script src="symbols.js"></script>
  <script src="descriptions.js"></script>
  <script src="app.js"></script>
</body>
</html>
